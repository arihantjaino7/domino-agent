# Production stack for one small VPS (PLAN §14.4): FalkorDB + app + Caddy (automatic HTTPS).
# Usage: docker compose -f docker-compose.prod.yml up -d --build     (see docs/DEPLOY.md)
name: domino-prod

services:
  falkordb:
    image: ${FALKORDB_IMAGE:?set FALKORDB_IMAGE in .env}
    environment:
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data # world graphs + the persistent memory graph
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped
    # No published ports: only the app can reach the database.

  app:
    build: .
    image: domino-app:latest
    env_file: .env
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      DOMINO_STATIC_DIR: /app/frontend/dist
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - runs:/app/backend/runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMINO_DOMAIN: ${DOMINO_DOMAIN:?set DOMINO_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  falkordb_data:
  runs:
  caddy_data:
  caddy_config:
