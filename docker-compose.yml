# FalkorDB for local dev. The app service and Caddy are added at deploy time (PLAN §14.4).
name: domino

services:
  falkordb:
    image: ${FALKORDB_IMAGE:-falkordb/falkordb:latest}
    # Reuses the name of the standalone container from setup, so `docker logs falkordb` etc. still work.
    container_name: falkordb
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "3000:3000" # FalkorDB Browser
    environment:
      # Image defaults are TIMEOUT 1000 / RESULTSET_SIZE 10000; see docs/SPIKE.md before changing.
      FALKORDB_ARGS: "MAX_QUEUED_QUERIES 25 TIMEOUT 1000 RESULTSET_SIZE 10000"
    volumes:
      - falkordb_data:/var/lib/falkordb/data # keeps the `memory` graph across restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: unless-stopped

volumes:
  falkordb_data:
