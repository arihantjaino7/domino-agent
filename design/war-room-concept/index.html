<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DOMINO war room concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="concept.css" />
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Views">
    <div class="logo" aria-hidden="true"><span></span><span></span></div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <div class="avatar" title="Approver: war room">AJ</div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="top-left">
        <span class="word">DOMINO</span>
        <span class="inc-pill"><i class="dot st-disrupted pulse"></i><b class="mono">INC-0001</b><span>Monsoon flooding, Chao Phraya Basin</span></span>
      </div>
      <nav class="tabs" id="topTabs" aria-label="Views"></nav>
      <div class="top-right">
        <div class="seg" role="group" aria-label="Agent mode">
          <button class="on" title="Free offline demo run">Demo</button><button>Claude Code</button><button>Claude API</button>
        </div>
        <span class="run-state" id="runState"></span>
      </div>
    </header>

    <section class="view" id="view-overview"></section>
    <section class="view" id="view-network"></section>
    <section class="view" id="view-incident"></section>
    <section class="view" id="view-logistics"></section>
    <section class="view" id="view-agent"></section>

    <footer class="concept-note">Concept only, not wired to the app. Every number here was captured from scripted run <span class="mono" id="runId"></span> (monsoon scenario) and <span class="mono">/api/graph</span>.</footer>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav" aria-label="Views"></nav>

<script src="data.js"></script>
<script src="concept.js"></script>
</body>
</html>
