[project]
name = "domino"
version = "0.1.0"
description = "DOMINO: autonomous multi-tier supply-chain recovery agent on FalkorDB"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic==1.15.0",
    "falkordb==1.8.0",
    "fastapi==0.143.3",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
    "sse-starlette==3.5.0",
    "uvicorn[standard]==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domino"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
